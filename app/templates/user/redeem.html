<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT 兑换</title>
    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/user.css') }}">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>GPT 兑换</h1>
            <p class="subtitle">使用兑换码获取 ChatGPT 服务</p>
            {% if remaining_spots is not none %}
            <div class="spots-badge">
                <i data-lucide="users"></i> 剩余车位: {{ remaining_spots }}
            </div>
            {% endif %}
        </div>

        <style>
            .spots-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: rgba(255, 255, 255, 0.1);
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 0.9rem;
                color: var(--primary-light);
                margin-top: 10px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .type-selector {
                display: flex;
                gap: 12px;
                margin-bottom: 1.5rem;
            }

            .type-btn {
                flex: 1;
                padding: 14px 20px;
                border: 2px solid rgba(255, 255, 255, 0.15);
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.05);
                color: var(--text-muted);
                cursor: pointer;
                transition: all 0.3s ease;
                text-align: center;
                font-size: 1rem;
                font-weight: 600;
                font-family: 'Outfit', sans-serif;
            }

            .type-btn:hover {
                border-color: rgba(255, 255, 255, 0.3);
                background: rgba(255, 255, 255, 0.08);
            }

            .type-btn.active {
                border-color: var(--primary);
                background: rgba(99, 102, 241, 0.15);
                color: var(--primary-light);
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            }

            .type-btn i {
                display: block;
                margin: 0 auto 6px;
            }

            .plus-info-card {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                padding: 1.5rem;
                margin: 1.5rem 0;
            }

            .plus-info-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }

            .plus-info-item:last-child {
                border-bottom: none;
            }

            .plus-info-label {
                color: var(--text-muted);
                font-size: 0.9rem;
            }

            .plus-info-value {
                color: var(--text-primary);
                font-weight: 500;
                word-break: break-all;
                text-align: right;
                max-width: 60%;
            }

            .plus-info-value a {
                color: var(--primary-light);
                text-decoration: none;
            }

            .plus-info-value a:hover {
                text-decoration: underline;
            }

            .copy-btn {
                background: rgba(255, 255, 255, 0.1);
                border: none;
                color: var(--text-muted);
                padding: 4px 10px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                margin-left: 8px;
                transition: all 0.2s;
            }

            .copy-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                color: var(--text-primary);
            }
        </style>

        <!-- 步骤1: 选择类型并输入信息 -->
        <div id="step1" class="step active">
            <div class="card">
                <h2>选择兑换类型</h2>

                <div class="type-selector">
                    <button class="type-btn active" id="typeTeamBtn" onclick="selectType('team')">
                        <i data-lucide="users" style="width: 24px; height: 24px;"></i>
                        Team
                    </button>
                    <button class="type-btn" id="typePlusBtn" onclick="selectType('plus')">
                        <i data-lucide="user" style="width: 24px; height: 24px;"></i>
                        Plus
                    </button>
                </div>

                <form id="verifyForm">
                    <div class="form-group">
                        <label for="email">邮箱地址</label>
                        <input type="email" id="email" name="email" required placeholder="请输入您的邮箱地址" class="form-input">
                        <p class="form-help" id="emailHelp">请使用您的常用邮箱,邀请将发送到此邮箱</p>
                    </div>

                    <div class="form-group">
                        <label for="code">兑换码</label>
                        <input type="text" id="code" name="code" required placeholder="请输入兑换码" class="form-input">
                    </div>

                    <button type="submit" class="btn btn-primary" id="verifyBtn">
                        <i data-lucide="shield-check"></i> 立即兑换
                    </button>
                </form>
            </div>
        </div>

        <!-- 步骤2: 选择Team (仅Team模式，已废弃但保留占位) -->
        <div id="step2" class="step" style="display: none;">
            <div class="card">
                <h2>选择 Team</h2>
                <div id="teamsList" class="teams-list"></div>
                <div class="actions">
                    <button onclick="backToStep1()" class="btn btn-secondary">返回</button>
                    <button onclick="autoSelectTeam()" class="btn btn-primary">自动选择</button>
                </div>
            </div>
        </div>

        <!-- 步骤3: 兑换结果 -->
        <div id="step3" class="step">
            <div class="card">
                <div id="resultContent">
                    <!-- 结果内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', path='/js/redeem.js') }}"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
